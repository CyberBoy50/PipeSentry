name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MY_TOKEN: ${{ secrets.MY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@b5d2142d2c33b2e2b4b8c99551d533bcfcceb365 # v4.2.1
        with:
          persist-credentials: false
      - name: Greet
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: 'echo "Thanks: $PR_TITLE"'
      - name: Check changed files
        uses: tj-actions/changed-files@8e261526c9a6242bd903b38138a00ccac0718406 # v45
      - name: Build
        run: npm ci && npm run build
